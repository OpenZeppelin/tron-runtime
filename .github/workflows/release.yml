name: Release

# Publishes the EXACT release-candidate tarball attached to the GitHub release —
# never a rebuild. Publishing a working directory would re-run `prepack` and mint
# new bytes, so nothing could prove the published artifact is the tarball the
# consumers verified. Publishing prefers npm trusted publishing (OIDC provenance);
# until the trusted publisher is configured on the npm side for this repository +
# workflow, the first publish falls back to the NPM_TOKEN secret (see "Check
# package publish status" below), gated behind the protected `publish` environment.
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm --provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check package publish status
        id: check-package
        run: |
          pkg="$(node -p "require('./package.json').name")"
          npm_stderr_file="$RUNNER_TEMP/npm-view.stderr"
          if npm view "$pkg" version > /dev/null 2> "$npm_stderr_file"; then
            echo "Package already published — using OIDC trusted publishing"
            echo "is_first_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm_error="$(tr '\n' ' ' < "$npm_stderr_file")"
          if [[ "$npm_error" == *"E404"* || "$npm_error" == *"404"* || "$npm_error" == *"Not Found"* ]]; then
            echo "::notice::First publish of $pkg — will use NPM_TOKEN for publish"
            echo "is_first_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view failed for $pkg: ${npm_error:-Unknown error}"
            exit 1
          fi
      - name: Configure npm auth
        env:
          IS_FIRST_PUBLISH: ${{ steps.check-package.outputs.is_first_publish }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$IS_FIRST_PUBLISH" = "true" ]; then
            # Not yet registered for OIDC trusted publishing — authenticate with
            # the npm token. setup-node's .npmrc reads it from NODE_AUTH_TOKEN.
            echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
          else
            # Trusted publishing via OIDC. npm only falls through to OIDC when no
            # _authToken is configured, so strip the line setup-node wrote to the
            # npm userconfig. Removing it is enough: nothing downstream then
            # reads NODE_AUTH_TOKEN.
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
              sed -i '/_authToken=/d' "$NPM_CONFIG_USERCONFIG"
            fi
          fi
      - name: Git tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(jq -r .version package.json)"
          test "$TAG" = "v$VERSION" || { echo "tag $TAG does not match package.json v$VERSION"; exit 1; }
      # `npm publish <file>` does NOT run prepublishOnly, so the API-surface /
      # stable-release gate must be invoked explicitly against the tag's source —
      # otherwise a stable version with provisional exports could slip out.
      - run: npm run check:api
      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Download the release-candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p rc && cd rc
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --pattern '*.tgz.sha256'
          COUNT="$(ls -1 -- *.tgz 2>/dev/null | wc -l)"
          test "$COUNT" -eq 1 || { echo "expected exactly one .tgz release asset, found $COUNT"; exit 1; }
      - name: Tarball is byte-identical to the recorded candidate
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd rc
          sha256sum --check --strict -- *.tgz.sha256
          TGZ="$(ls -1 -- *.tgz)"
          PACKED_VERSION="$(tar -xzOf "$TGZ" package/package.json | jq -r .version)"
          test "$TAG" = "v$PACKED_VERSION" || { echo "tarball version $PACKED_VERSION does not match tag $TAG"; exit 1; }
          echo "EXPECTED_INTEGRITY=sha512-$(openssl dgst -sha512 -binary "$TGZ" | base64 -w0)" >> "$GITHUB_ENV"
      - name: Publish the exact verified bytes
        run: |
          cd rc
          npm publish "./$(ls -1 -- *.tgz)" --provenance --access public
      - name: Registry integrity matches the published file
        run: |
          VERSION="$(jq -r .version package.json)"
          PUBLISHED=""
          for attempt in 1 2 3 4 5; do
            PUBLISHED="$(npm view "@openzeppelin/tron-runtime@$VERSION" dist.integrity 2>/dev/null || true)"
            [ -n "$PUBLISHED" ] && break
            sleep 10
          done
          test "$PUBLISHED" = "$EXPECTED_INTEGRITY" || { echo "registry integrity '$PUBLISHED' does not match the published file '$EXPECTED_INTEGRITY'"; exit 1; }
