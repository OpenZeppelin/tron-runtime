name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:package
      # Informational until the transitive `ws` advisory under tronweb is triaged
      # and resolved before publish. Do not force-downgrade blindly.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
