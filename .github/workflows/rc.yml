name: Release candidate

# Builds the ONE canonical release-candidate tarball in CI and records its
# identity (SHA-256 + npm integrity). The release workflow later publishes
# EXACTLY these bytes — never a rebuild — so what ships is provably what was
# verified against the consumers.
on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Blocking here (unlike the informational CI step): a release candidate
      # cannot be cut while a high-severity production advisory is open.
      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Pack the candidate tarball
        run: |
          TGZ="$(npm pack | tail -1)"
          sha256sum "$TGZ" > "$TGZ.sha256"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TGZ" | base64 -w0)"
          {
            echo "## Release candidate"
            echo "- file: \`$TGZ\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- sha256: \`$(cut -d' ' -f1 "$TGZ.sha256")\`"
            echo "- npm integrity: \`$INTEGRITY\`"
            echo
            echo "Attach \`$TGZ\` and \`$TGZ.sha256\` to the GitHub release unchanged;"
            echo "the release workflow refuses anything whose hash does not match."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            *.tgz
            *.tgz.sha256
          if-no-files-found: error
